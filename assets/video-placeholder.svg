<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Video placeholder</title>
  <desc id="desc">A placeholder instructing the site author to add an MP4 video.</desc>
  <rect width="1600" height="900" fill="#111827"/>
  <circle cx="800" cy="400" r="92" fill="#ef8354"/>
  <path d="m776 350 90 50-90 50z" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="800" y="570" fill="#fff" font-size="46" font-weight="700">Add your MP4 video</text>
    <text x="800" y="625" fill="#aeb7c8" font-size="26">See media/README.md for filenames and encoding guidance</text>
  </g>
</svg>
